name: Daily Gold Rate Notifier

on:
  schedule:
    # Run daily at 8 AM UTC (3:30 PM IST)
    - cron: '0 8 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  send-gold-rate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Gold Rate Notifier
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: chmod +x ./gradlew && ./gradlew run

      - name: Log if email sent
        if: success()
        run: echo "✅ Gold rate email sent successfully!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Failed to send gold rate email"

