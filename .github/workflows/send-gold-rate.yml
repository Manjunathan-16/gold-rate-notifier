name: Send Gold Rate and Deploy Site

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 04:30 UTC (which is 10:00 IST). Change the cron if you want a different timezone/time.
    - cron: '30 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Variables used by the Java application (set these as repository Secrets in GitHub)
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      # Optional / legacy variables (not currently used by the Java code but kept for compatibility)
      TARGET_URL: ${{ secrets.TARGET_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # (No separate Gradle setup step; the repository includes a Gradle wrapper `gradlew`.)

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew || true

      - name: Build and run project (use wrapper if present, otherwise install Gradle)
        run: |
          set -e
          if [ -x "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Using repository Gradle wrapper"
            ./gradlew --no-daemon build
            ./gradlew --no-daemon run
          else
            echo "Gradle wrapper missing or incomplete; installing Gradle via apt-get"
            sudo apt-get update -y
            sudo apt-get install -y gradle
            gradle --version
            gradle --no-daemon build
            gradle --no-daemon run
          fi
